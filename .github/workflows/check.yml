name: check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: python3 -m unittest discover -s tests -q
      - name: Check and build
        run: python3 check.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
      - name: Open or close outage issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in "Sandbox gateway" "Rulebook feed" "Website"; do
            open=$(gh issue list --state open --search "in:title \"Down: $name\"" --json number --jq '.[0].number')
            if grep -qxF "$name" down.txt; then
              [ -n "$open" ] || gh issue create --title "Down: $name" --body "Failed two checks in a row at $(date -u '+%Y-%m-%d %H:%M UTC'). https://status.quarterfi.com/"
            elif [ -n "$open" ]; then
              gh issue close "$open" --comment "Back up at $(date -u '+%Y-%m-%d %H:%M UTC')."
            fi
          done
